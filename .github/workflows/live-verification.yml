name: Live release verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for exact release on existing Render service
        env:
          BASE_URL: https://underhive-duel.onrender.com
        run: |
          node --input-type=module <<'JS'
          const until=Date.now()+8*60*1000;
          let verified=false;
          while(Date.now()<until){
            try {
              const response=await fetch(process.env.BASE_URL+'/health',{signal:AbortSignal.timeout(15000)});
              const health=await response.json();
              if(response.ok&&health.ok&&health.commit===process.env.GITHUB_SHA&&health.rulesVersion==='0.2.0'&&health.visualVersion==='0.2.0'){
                console.log(JSON.stringify(health));verified=true;break;
              }
              console.log('Waiting for expected deployment',health.commit);
            } catch(e) { console.log('Waiting for service health',e.message); }
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!verified)throw Error('Expected release did not become healthy before timeout');
          JS
      - name: Verify public browser matches, rematches, layouts and sprites
        env:
          BASE_URL: https://underhive-duel.onrender.com
        run: npm run test:browser
      - name: Preserve live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-evidence
          path: docs/browser-evidence/
          retention-days: 14
